name: CI

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    name: Core and UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the full suite
        run: npm test

  desktop:
    name: Desktop package (${{ matrix.label }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            artifact: desktop-linux
          - os: windows-latest
            label: Windows
            artifact: desktop-windows
          - os: macos-latest
            label: macOS
            artifact: desktop-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build desktop ZIP
        run: npm run make:desktop

      - name: Upload desktop ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/make/**/*.zip
          if-no-files-found: error

  plugin:
    name: Icestudio plugin package
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create plugin ZIP
        run: |
          mkdir -p dist/fsm-editor
          cp -r index.html css js examples manifest.json icon.svg README.md dist/fsm-editor/
          cd dist
          zip -r "fsm-editor-plugin-${GITHUB_REF_NAME}.zip" fsm-editor

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: icestudio-plugin
          path: dist/fsm-editor-plugin-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [desktop, plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip
          generate_release_notes: true
